name: Full Verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-verify:
    name: Full Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm install -g @earendil-works/pi-coding-agent@0.82.1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          npm ci

      - name: Install current MySpec package
        shell: bash
        run: |
          pack_json="$(npm pack ./plugins/my-spec --pack-destination "$RUNNER_TEMP" --json)"
          tarball="$(node -e 'console.log(JSON.parse(process.argv[1])[0].filename)' "$pack_json")"
          prefix="$RUNNER_TEMP/myspec-prefix"
          npm install -g --prefix "$prefix" "$RUNNER_TEMP/$tarball"
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "MYSPEC_TEST_TARBALL=$RUNNER_TEMP/$tarball" >> "$GITHUB_ENV"
          "$prefix/bin/myspec" --help

      - name: Run full verification
        run: python .build-and-verify/runtime/build_and_verify.py verify --project . --full

  windows-worktree-smoke:
    name: Windows worktree smoke
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Initialize main worktree
        shell: pwsh
        run: ./scripts/setup-worktree.ps1

      - name: Initialize linked worktree
        shell: pwsh
        run: |
          git worktree add --detach .worktrees/smoke HEAD
          ./.worktrees/smoke/scripts/setup-worktree.ps1

      - name: Build from linked worktree
        shell: pwsh
        run: |
          . ./.worktrees/smoke/.venv/Scripts/Activate.ps1
          python .worktrees/smoke/.build-and-verify/runtime/build_and_verify.py build --project .worktrees/smoke

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
      version:
        description: Release version
        required: true
        type: string
      bumpPlugins:
        description: Comma-separated plugins to bump; empty means catalog/projection only
        required: true
        type: string

permissions:
  contents: write
  actions: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          path: source

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r source/requirements-dev.txt
          npm install -g @earendil-works/pi-coding-agent@0.82.1
          npm ci --prefix source/plugins/pi-tool-display

      - name: Install current MySpec package
        shell: bash
        run: |
          tarball="$(npm pack source/plugins/my-spec --pack-destination "$RUNNER_TEMP")"
          prefix="$RUNNER_TEMP/myspec-prefix"
          npm install -g --prefix "$prefix" "$RUNNER_TEMP/$tarball"
          echo "$prefix/bin" >> "$GITHUB_PATH"
          "$prefix/bin/myspec" --help

      - name: Run full verification
        run: python source/.build-and-verify/runtime/build_and_verify.py verify --project source --full

      - name: Publish MySpec npm package
        working-directory: source/plugins/my-spec
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          BUMP_PLUGINS: ${{ inputs.bumpPlugins }}
        run: |
          if [[ ",$BUMP_PLUGINS," != *",my-spec,"* ]]; then
            echo "my-spec is not part of this release"
          elif [[ "$(node -p "require('./package.json').version")" != "$RELEASE_VERSION" ]]; then
            echo "MySpec package version does not match release version" >&2
            exit 1
          elif npm view "@liuli195/myspec@$RELEASE_VERSION" version >/dev/null 2>&1; then
            echo "@liuli195/myspec@$RELEASE_VERSION is already published"
          else
            npm publish --provenance --access public
          fi

      - name: Publish release channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python source/plugins/release-flow/skills/release-flow/scripts/release_flow.py
          ci-publish
          --project source
          --tag "${{ inputs.tag }}"
          --version "${{ inputs.version }}"
          --bump-plugins "${{ inputs.bumpPlugins }}"
          --authorize-ci-publish

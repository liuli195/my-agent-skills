name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
      version:
        description: Release version
        required: true
        type: string
      bumpPlugins:
        description: Comma-separated plugins to bump; empty means catalog/projection only
        required: true
        type: string

permissions:
  contents: write
  actions: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_VERSION: ${{ inputs.version }}
      BUMP_PLUGINS: ${{ inputs.bumpPlugins }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          path: source

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r source/requirements-dev.txt
          npm install -g @earendil-works/pi-coding-agent@0.82.1
          npm ci --prefix source/plugins/pi-tool-display

      - name: Install current MySpec package
        shell: bash
        run: |
          pack_json="$(npm pack source/plugins/my-spec --pack-destination "$RUNNER_TEMP" --json)"
          tarball="$(node -e 'console.log(JSON.parse(process.argv[1])[0].filename)' "$pack_json")"
          integrity="$(node -e 'console.log(JSON.parse(process.argv[1])[0].integrity)' "$pack_json")"
          tarball_path="$RUNNER_TEMP/$tarball"
          prefix="$RUNNER_TEMP/myspec-prefix"
          npm install -g --prefix "$prefix" "$tarball_path"
          echo "$prefix/bin" >> "$GITHUB_PATH"
          echo "MYSPEC_TARBALL=$tarball_path" >> "$GITHUB_ENV"
          echo "MYSPEC_TEST_TARBALL=$tarball_path" >> "$GITHUB_ENV"
          echo "MYSPEC_INTEGRITY=$integrity" >> "$GITHUB_ENV"
          "$prefix/bin/myspec" --help

      - name: Run full verification
        run: python source/.build-and-verify/runtime/build_and_verify.py verify --project source --full

      - name: Validate release plan
        run: >
          python source/plugins/release-flow/skills/release-flow/scripts/release_flow.py
          preflight
          --project source
          --tag "$RELEASE_TAG"
          --version "$RELEASE_VERSION"
          --bump-plugins "$BUMP_PLUGINS"
          --allow-existing-release

      - name: Publish MySpec npm package
        run: |
          normalized_plugins="${BUMP_PLUGINS//[[:space:]]/}"
          if [[ ",$normalized_plugins," != *",my-spec,"* ]]; then
            echo "my-spec is not part of this release"
          elif [[ "$(node -p "require('./source/plugins/my-spec/package.json').version")" != "$RELEASE_VERSION" ]]; then
            echo "MySpec package version does not match release version" >&2
            exit 1
          else
            published_integrity="$(npm view "@liuli195/myspec@$RELEASE_VERSION" dist.integrity 2>/dev/null || true)"
            if [[ -n "$published_integrity" && "$published_integrity" != "$MYSPEC_INTEGRITY" ]]; then
              echo "Published MySpec package does not match the verified Tarball" >&2
              exit 1
            elif [[ -n "$published_integrity" ]]; then
              echo "@liuli195/myspec@$RELEASE_VERSION is already published and verified"
            else
              npm publish "$MYSPEC_TARBALL" --provenance --access public
            fi
          fi

      - name: Publish release channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python source/plugins/release-flow/skills/release-flow/scripts/release_flow.py
          ci-publish
          --project source
          --tag "$RELEASE_TAG"
          --version "$RELEASE_VERSION"
          --bump-plugins "$BUMP_PLUGINS"
          --authorize-ci-publish
